# ================================================================
# UniSwap - application.properties
# ================================================================
# The Swing desktop client talks to this backend over localhost only,
# so no external network exposure is needed.
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# Database connection
# ---------------------------------------------------------------
# Enter your own local MySQL credentials here, OR (recommended) set
# the DB_USERNAME / DB_PASSWORD environment variables before running
# the app so you never have to hard-code a password in this file.
#   PowerShell:  $env:DB_USERNAME="root"
#                $env:DB_PASSWORD="your_mysql_password"
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:uniswap_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
# update = create missing tables/columns automatically without
# wiping existing data. Safe for a student project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.com.uniswap=INFO

# ---------------------------------------------------------------
# Product photo uploads
# ---------------------------------------------------------------
# Photos are saved under this folder (default: <your home folder>/SwapUni/uploads)
# so they survive no matter which directory you launch the app from.
# Override with the UPLOAD_DIR environment variable if you like.
swapuni.upload-dir=${UPLOAD_DIR:${user.home}/SwapUni/uploads}
# 5 MB per image (the service layer enforces the same limit).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
